<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JSON Formatter</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="description" content="Format, prettify, minify and validate JSON in your browser. Nothing is uploaded.">
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2433; --muted: #6b7385; --border: #d9dde5;
    --accent: #2f6fed; --accent-text: #ffffff; --error: #c62828; --error-bg: #fdecea;
    --key: #0b5cad; --string: #1a7f37; --number: #b35c00; --bool: #8250df; --null: #9a6700;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1218; --panel: #171b23; --text: #e4e7ee; --muted: #8a93a6; --border: #2a303c;
      --accent: #5b8cff; --accent-text: #0b1020; --error: #ff8a80; --error-bg: #3a1c1c;
      --key: #79b8ff; --string: #7ee787; --number: #ffa657; --bool: #d2a8ff; --null: #e3b341;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1218; --panel: #171b23; --text: #e4e7ee; --muted: #8a93a6; --border: #2a303c;
    --accent: #5b8cff; --accent-text: #0b1020; --error: #ff8a80; --error-bg: #3a1c1c;
    --key: #79b8ff; --string: #7ee787; --number: #ffa657; --bool: #d2a8ff; --null: #e3b341;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  header, main, footer { width: 100%; max-width: 1400px; margin: 0 auto; padding-left: 16px; padding-right: 16px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 16px; padding-bottom: 8px; }
  h1 { font-size: 20px; margin: 0; }
  h1 small { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 8px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-bottom: 12px; }
  button, select, label.btn {
    font: inherit; font-size: 14px; color: var(--text); background: var(--panel);
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px; cursor: pointer;
  }
  button:hover, label.btn:hover, select:hover { border-color: var(--accent); }
  button:focus-visible, select:focus-visible, textarea:focus-visible, label.btn:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  .check { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); }
  .spacer { flex: 1; }
  main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding-bottom: 12px; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  .pane { display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; min-height: 280px; overflow: hidden; }
  .pane-head { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--border); color: var(--muted); font-size: 13px; }
  textarea, pre#out {
    flex: 1; margin: 0; padding: 12px; border: 0; background: transparent; color: var(--text);
    font: 13.5px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    resize: none; width: 100%; min-height: 50vh; overflow: auto; tab-size: 2;
  }
  textarea { outline: none; }
  pre#out { white-space: pre; }
  pre#out:empty::before { content: "Formatted output appears here"; color: var(--muted); }
  .k { color: var(--key); } .s { color: var(--string); } .n { color: var(--number); }
  .b { color: var(--bool); } .z { color: var(--null); }
  #status { margin: 0 auto; width: 100%; max-width: 1400px; padding: 0 16px 12px; }
  #status div { padding: 8px 12px; border-radius: 6px; font-size: 14px; border: 1px solid var(--border); background: var(--panel); color: var(--muted); }
  #status div.err { background: var(--error-bg); border-color: var(--error); color: var(--error); }
  footer { padding-bottom: 16px; color: var(--muted); font-size: 13px; }
  a { color: var(--accent); }
  nav { display: flex; gap: 4px; }
  nav a { padding: 4px 10px; border-radius: 6px; text-decoration: none; color: var(--muted); border: 1px solid transparent; font-size: 14px; }
  nav a[aria-current="page"] { color: var(--text); border-color: var(--border); background: var(--panel); }
</style>
</head>
<body>
<header>
  <h1>JSON Formatter <small>runs entirely in your browser</small></h1>
  <div style="display:flex;gap:8px;align-items:center">
    <nav aria-label="Tools"><a href="index.html" aria-current="page">JSON</a><a href="xml.html">XML</a></nav>
    <button id="theme" type="button" aria-label="Toggle dark mode">Theme</button>
  </div>
</header>

<div class="toolbar" style="max-width:1400px;margin:0 auto;width:100%;padding-left:16px;padding-right:16px">
  <button id="format" class="primary" type="button">Format</button>
  <button id="minify" type="button">Minify</button>
  <select id="indent" aria-label="Indentation">
    <option value="2">2 spaces</option>
    <option value="4">4 spaces</option>
    <option value="tab">Tab</option>
  </select>
  <label class="check"><input type="checkbox" id="sort"> Sort keys</label>
  <span class="spacer"></span>
  <label class="btn">Open file<input type="file" id="file" accept=".json,application/json,text/plain" hidden></label>
  <button id="copy" type="button">Copy</button>
  <button id="download" type="button">Download</button>
  <button id="clear" type="button">Clear</button>
</div>

<div id="status" aria-live="polite"><div id="msg">Paste JSON on the left.</div></div>

<main>
  <section class="pane">
    <div class="pane-head"><span>Input</span><span id="inSize"></span></div>
    <textarea id="in" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder='{"paste":"your JSON here"}'></textarea>
  </section>
  <section class="pane">
    <div class="pane-head"><span>Output</span><span id="outSize"></span></div>
    <pre id="out"></pre>
  </section>
</main>

<footer>Your data never leaves this page. Tip: press Ctrl/Cmd + Enter to format.</footer>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var input = $("in"), out = $("out"), msg = $("msg");
  var plain = ""; // plain-text result, used for copy/download

  function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

  function highlight(text) {
    return esc(text).replace(
      /("(?:\\u[a-fA-F0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(?:true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,
      function (m) {
        var c = "n";
        if (m.charAt(0) === '"') c = /:$/.test(m) ? "k" : "s";
        else if (m === "true" || m === "false") c = "b";
        else if (m === "null") c = "z";
        return '<span class="' + c + '">' + m + "</span>";
      });
  }

  function sortKeys(v) {
    if (Array.isArray(v)) return v.map(sortKeys);
    if (v && typeof v === "object") {
      var o = {};
      Object.keys(v).sort().forEach(function (k) { o[k] = sortKeys(v[k]); });
      return o;
    }
    return v;
  }

  function bytes(s) {
    var n = new Blob([s]).size;
    return n < 1024 ? n + " B" : (n / 1024).toFixed(1) + " KB";
  }

  function errorLocation(e, text) {
    var m = /position (\d+)/.exec(e.message), line, col;
    if (m) {
      var pos = +m[1], before = text.slice(0, pos).split("\n");
      line = before.length; col = before[before.length - 1].length + 1;
    } else if ((m = /line (\d+) column (\d+)/.exec(e.message))) {
      line = +m[1]; col = +m[2];
    }
    return line ? " (line " + line + ", column " + col + ")" : "";
  }

  function setStatus(text, isErr) {
    msg.textContent = text;
    msg.className = isErr ? "err" : "";
  }

  function run(minify) {
    var text = input.value;
    $("inSize").textContent = text ? bytes(text) : "";
    if (!text.trim()) {
      plain = ""; out.textContent = ""; $("outSize").textContent = "";
      setStatus("Paste JSON on the left.", false);
      return;
    }
    var data;
    try { data = JSON.parse(text); }
    catch (e) {
      plain = ""; out.textContent = ""; $("outSize").textContent = "";
      setStatus("Invalid JSON: " + e.message.replace(/^JSON\.parse: /, "") + errorLocation(e, text), true);
      return;
    }
    if ($("sort").checked) data = sortKeys(data);
    var ind = $("indent").value;
    plain = JSON.stringify(data, null, minify ? 0 : (ind === "tab" ? "\t" : +ind));
    out.innerHTML = highlight(plain);
    $("outSize").textContent = bytes(plain);
    setStatus("Valid JSON. " + (minify ? "Minified" : "Formatted") + " " + bytes(text) + " → " + bytes(plain) + ".", false);
  }

  var timer;
  input.addEventListener("input", function () { clearTimeout(timer); timer = setTimeout(function () { run(false); }, 250); });
  input.addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); run(false); }
  });
  $("format").onclick = function () { run(false); };
  $("minify").onclick = function () { run(true); };
  $("indent").onchange = $("sort").onchange = function () { run(false); };

  $("clear").onclick = function () { input.value = ""; run(false); input.focus(); };

  $("copy").onclick = function () {
    if (!plain) return;
    var done = function () { setStatus("Copied to clipboard.", false); };
    if (navigator.clipboard) navigator.clipboard.writeText(plain).then(done, function () { setStatus("Copy failed.", true); });
    else { var r = document.createRange(); r.selectNodeContents(out); var s = getSelection(); s.removeAllRanges(); s.addRange(r); document.execCommand("copy"); done(); }
  };

  $("download").onclick = function () {
    if (!plain) return;
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([plain], { type: "application/json" }));
    a.download = "formatted.json";
    a.click();
    URL.revokeObjectURL(a.href);
  };

  $("file").onchange = function (e) {
    var f = e.target.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () { input.value = r.result; run(false); };
    r.readAsText(f);
    e.target.value = "";
  };

  // drag & drop a file onto the input
  input.addEventListener("dragover", function (e) { e.preventDefault(); });
  input.addEventListener("drop", function (e) {
    var f = e.dataTransfer.files[0];
    if (!f) return;
    e.preventDefault();
    var r = new FileReader();
    r.onload = function () { input.value = r.result; run(false); };
    r.readAsText(f);
  });

  // theme toggle (remembered when storage is available)
  function applyTheme(t) { if (t) document.documentElement.setAttribute("data-theme", t); }
  try { applyTheme(localStorage.getItem("theme")); } catch (e) {}
  $("theme").onclick = function () {
    var cur = document.documentElement.getAttribute("data-theme") ||
      (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    var next = cur === "dark" ? "light" : "dark";
    applyTheme(next);
    try { localStorage.setItem("theme", next); } catch (e) {}
  };

  run(false);
})();
</script>
</body>
</html>
